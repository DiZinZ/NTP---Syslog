# Servidor NTP do laboratório (chrony)
# Fontes superiores (stratum 1/2) – o servidor do lab fica um nível abaixo
pool pool.ntp.br iburst maxsources 4
# Se a internet cair, continua servindo horário local (stratum 10)
local stratum 10
# Quem pode consultar este servidor
allow 172.20.15.0/24
driftfile /var/lib/chrony/chrony.drift
logdir /var/log/chrony
log tracking measurements statistics
