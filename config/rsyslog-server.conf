# Servidor de logs centralizado
module(load="imuxsock")
module(load="imudp")
input(type="imudp" port="514")      # Syslog UDP 514
module(load="imtcp")
input(type="imtcp" port="514")      # Syslog TCP 514
global(workDirectory="/var/spool/rsyslog")

# Formato de saída: data RFC3339 | host | facility.severity | tag: mensagem
template(name="Linha" type="string"
  string="%timegenerated:::date-rfc3339% %HOSTNAME% %syslogfacility-text%.%syslogseverity-text% %syslogtag%%msg:::sp-if-no-1st-sp%%msg:::drop-last-lf%\n")
# Um diretório por host de origem, um arquivo por programa
template(name="PorHost" type="string" string="/var/log/remote/%HOSTNAME%/%programname%.log")

action(type="omfile" dynaFile="PorHost" template="Linha")
action(type="omfile" file="/var/log/remote/all.log" template="Linha")
